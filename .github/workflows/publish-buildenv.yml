name: Publish build environment image
# Manually-triggered helper that builds and pushes the Ubuntu build environment
# image (releng/buildenv/ubuntu/Dockerfile) to Docker Hub.
#
# The overall process stays manual on purpose: a maintainer decides when a new
# environment is ready and runs this workflow, providing the target tag. The
# Dockerfile always tracks the latest supported environment, so each run
# produces a new immutable tag. Stable CI lanes keep using older tags while the
# test_latest lane is updated to the newest one.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account that owns the basilevs/ubuntu-rcptt repository
#   DOCKERHUB_TOKEN    - Docker Hub access token with write access to that repository
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full image reference to build and push (repository:tag)'
        required: true
        default: 'basilevs/ubuntu-rcptt:3.8.0'
      push:
        description: 'Push the image to Docker Hub (uncheck to only build)'
        type: boolean
        required: false
        default: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: releng/buildenv/ubuntu
          file: releng/buildenv/ubuntu/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ inputs.image }}
